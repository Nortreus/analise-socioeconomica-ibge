name: Atualizacao Automatica de Dados IBGE

on:
  push:
    branches: [ main, master ]
  schedule:
    # Dispara a execução toda segunda-feira às 06:00 AM (Horário de Brasília)
    - cron: '0 9 * * 1'

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Verificar Codigo do Repositorio
      uses: actions/checkout@v4

    - name: Configurar o Ambiente Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar Dependencias do Script
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy seaborn matplotlib scipy requests

    - name: Executar Pipeline de Dados (Python)
      run: python script.py

    - name: Salvar Modificacoes no Repositorio (Commit do Grafico Novo)
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        git add grafico_socioeconomico.png
        git diff --quiet && git diff --staged --quiet || (git commit -m "auto: atualizacao automatica do grafico IBGE" && git push)
